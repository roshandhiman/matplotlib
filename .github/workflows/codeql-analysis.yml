---
name: "CodeQL"

on:
  push:
    branches: [main, v*.x]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '45 19 * * 1'

permissions: {}

jobs:
  analyze:
